<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three Restaurants I Like in Davis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 38px 20px 48px;
      background: #f4f7fb;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #55718e;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #173b5e;
      font-size: 32px;
      line-height: 1.2;
    }
    .intro {
      margin: 13px auto 25px;
      max-width: 650px;
      color: #526273;
      font-size: 16px;
      line-height: 1.6;
    }
    .map-frame {
      width: 800px;
      height: 600px;
      max-width: 100%;
      border: 0;
      border-radius: 12px;
      background: white;
      box-shadow: 0 8px 26px rgba(20, 45, 70, .14);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      margin: 20px auto 0;
      color: #34495e;
      font-size: 14px;
    }
    .legend span { white-space: nowrap; }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
    }
    .red { background: #d9534f; }
    .blue { background: #337ab7; }
    .green { background: #398b57; }
    footer {
      margin-top: 24px;
      color: #718096;
      font-size: 12px;
    }
    @media (max-width: 840px) {
      body { padding: 26px 12px; }
      h1 { font-size: 26px; }
      .map-frame { height: 600px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Explore Downtown Davis</p>
    <h1>Three Restaurants I Like in Davis</h1>
    <p class="intro">
      A small map of three Davis restaurant picks. Select a marker to see
      the restaurant name and address.
    </p>

    <iframe
      class="map-frame"
      src="map.html"
      width="800"
      height="600"
      title="Map of three restaurants in Davis, California"
      loading="lazy">
    </iframe>

    <div class="legend" aria-label="Map marker legend">
      <span><i class="dot red"></i>Burgers &amp; Brew</span>
      <span><i class="dot blue"></i>Crepeville</span>
      <span><i class="dot green"></i>Mikuni</span>
    </div>
    <footer>Map centered on Philz Coffee, 521 2nd Street, Davis, California.</footer>
  </main>
</body>
</html>
